name: Verify published preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: verify-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scaffold is in the publication source
        run: |
          test -f about.html
          test -f site-assets/assets/css/internal.css
          test -f site-assets/assets/css/requisites.css
          test -f site-assets/assets/css/payment-delivery.css
          (cd downloads && sha256sum --check moscow-city-print-child-0.5.0.zip.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          text = Path('about.html').read_text().replace('\u00a0', ' ')
          assert '<h1 class="mcp-page-title">Типография для бизнеса</h1>' in text
          assert 'mcp-inner-hero' in text and 'mcp-content-with-clients' in text
          assert text.count('class="mcp-about-art"') == 3
          assert 'images/illustrations/library/01-printing-press-stack.webp' in text
          assert Path('site-assets/assets/images/illustrations/library/01-printing-press-stack.webp').is_file()
          assert 'images/illustrations/library/05-graphite-print-sheet-control.webp' in text
          assert 'images/illustrations/mcp-illustration-team-production.webp' not in text
          assert Path('site-assets/assets/images/illustrations/library/05-graphite-print-sheet-control.webp').is_file()
          assert 'mcp-illustration-print-production.webp' not in text
          assert '<span class="num">05</span>' in text
          assert Path('site-assets/assets/css/about.css').is_file()
          for name in ('team-production','moscow-city'):
              assert Path('site-assets/assets/images/illustrations/mcp-illustration-' + name + '.webp').is_file()
          assert '10 000+' in text and 'mcp-about-stat-module' in text
          assert 'mcp-about-principles' not in text
          assert 'постоянных корпоративных клиентов' not in text
          assert 'Работаем с компаниями, малым' not in text
          assert text.index('НАША КОМАНДА') < text.index('НАШ ПОДХОД') < text.index('НАШЕ ПРОСТРАНСТВО')
          assert 'clients-next' in text and 'assets/js/home.js' not in text
          assert 'брендбука' not in text
          services = Path('services.html').read_text()
          assert '<h1 class="mcp-page-title">Услуги</h1>' in services
          assert 'service-card' not in services and '<details' not in services
          for filename in ('index.html','requisites.html','payment-delivery.html'):
              assert '>Карта сайта</a>' in Path(filename).read_text()
          requisites = Path('requisites.html').read_text()
          assert 'class="mcp-requisites-details"' in requisites
          assert 'class="mcp-page-title"' not in requisites
          assert 'Подготовка документов обычно занимает от 1 до 5 рабочих дней.' in requisites
          for value in ('Лис Анна Владимировна','772425521744','320774600200503','mailto:office@moscowcityprint.ru'):
              assert value in requisites, value
          payment = Path('payment-delivery.html').read_text()
          assert 'class="mcp-delivery-options"' in payment
          assert '100% предоплате' in payment
          for route in ('index','about','services','products','blog','privacy-policy','payment-delivery','artwork-requirements','requisites','sitemap','vacancies','404'):
              assert Path(route + '.html').is_file(), route
          blog = Path('blog.html').read_text()
          assert '<h1 class="mcp-page-title">БЛОГ</h1>' in blog
          assert 'mcp-blog-search' in blog and 'mcp-blog-filters' in blog
          assert 'preview-assets/blog.js' in blog
          assert Path('preview-assets/blog.js').is_file()
          for css in ('blog', 'article'):
              assert Path('site-assets/assets/css/' + css + '.css').is_file()
          for route in ('article-short', 'article-long'):
              article = Path(route + '.html').read_text()
              assert len(re.findall(r'<h1\b', article)) == 1
              assert article.count('rel="canonical"') == 1
              assert 'noindex,nofollow' in article
              assert 'mcp-article-navigation' in article and 'Все статьи' in article
              schema = json.loads(re.search(r'<script type="application/ld\+json">(.*?)</script>', article, re.S).group(1))
              assert schema['@graph'][0]['@type'] == 'BlogPosting'
              assert schema['@graph'][1]['@type'] == 'BreadcrumbList'
          policy = Path('privacy-policy.html').read_text()
          assert 'ПОЛИТИКА КОНФИДЕНЦИАЛЬНОСТИ' in policy
          assert 'Дата публикации: 22 сентября 2026 года' in policy
          assert policy.count('<h2>') == 16
          assert '14. Требования к обработке персональных данных' in policy
          assert '16. Контактная информация' in policy
          assert Path('site-assets/assets/css/privacy-policy.css').is_file()
          not_found = Path('404.html').read_text()
          assert 'На главную →' in not_found
          assert 'К сожалению, такой страницы не существует.' in not_found
          assert 'Она могла быть удалена или её адрес изменился.' in not_found
          assert '>УПС</span>' in not_found
          assert 'mcp-404-illustration-final.webp' in not_found
          assert 'mcp-404-illustration.webp' not in not_found
          assert Path('site-assets/assets/images/illustrations/mcp-404-illustration-final.webp').is_file()
          assert not Path('site-assets/assets/images/illustrations/mcp-404-illustration.webp').exists()
          assert Path('site-assets/assets/css/not-found.css').is_file()
          assert 'href="/moscow-city-print-preview/index.html"' in not_found
          assert 'href="/moscow-city-print-preview/site-assets/assets/css/internal.css"' in not_found
          assert not Path('contacts.html').exists()
          sitemap = Path('sitemap.html').read_text()
          assert '<ul>' not in sitemap and '<ol>' not in sitemap
          assert 'КАРТА САЙТА' in sitemap
          assert sitemap.count('class="mcp-sitemap-group"') == 3
          for title in ('Основные', 'Информация', 'Служебные'):
              assert '<h2>' + title + '</h2>' in sitemap
          assert Path('site-assets/assets/css/sitemap.css').is_file()
          assert 'href="#contacts">Контакты</a>' in sitemap
          for page in Path('.').glob('*.html'):
              html = page.read_text()
              assert 'href="contacts.html"' not in html and 'href="/contacts/"' not in html, page
              assert 'id="contacts"' in html and 'href="#contacts"' in html, page
          PY
      - name: Read GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" \
            --jq '{html_url,build_type,status,source}' | tee pages-config.json
      - name: Verify the exact public 404 preview URL after deployment
        env:
          PUBLIC_URL: https://annie-lis.github.io/moscow-city-print-preview/404.html
          PUBLIC_CSS_URL: https://annie-lis.github.io/moscow-city-print-preview/site-assets/assets/css/internal.css
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' --output live-404.html \
              --write-out '%{http_code}' "$PUBLIC_URL" || true)
            echo "Attempt $attempt: $PUBLIC_URL HTTP $code"
            curl --fail --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' --output live-404.css "$PUBLIC_CSS_URL" || true
            for file in about.html requisites.html site-assets/assets/css/about.css site-assets/assets/css/privacy-policy.css site-assets/assets/css/requisites.css downloads/moscow-city-print-child-0.5.0.zip; do
              mkdir -p "live/$(dirname "$file")"
              curl --fail --silent --show-error --location --max-time 20 \
                --header 'Cache-Control: no-cache' --output "live/$file" \
                "https://annie-lis.github.io/moscow-city-print-preview/$file" || true
            done
            if [ "$code" = 200 ] && cmp --silent 404.html live-404.html && \
              cmp --silent about.html live/about.html && \
              cmp --silent site-assets/assets/css/about.css live/site-assets/assets/css/about.css && \
              cmp --silent site-assets/assets/css/privacy-policy.css live/site-assets/assets/css/privacy-policy.css && \
              cmp --silent requisites.html live/requisites.html && \
              cmp --silent site-assets/assets/css/requisites.css live/site-assets/assets/css/requisites.css && \
              cmp --silent downloads/moscow-city-print-child-0.5.0.zip live/downloads/moscow-city-print-child-0.5.0.zip && \
              cmp --silent site-assets/assets/css/internal.css live-404.css; then
              echo "Verified HTTP 200 and exact content match for commit $GITHUB_SHA"
              sha256sum 404.html live-404.html
              echo "Verified public shared internal stylesheet matches source"
              python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('pages-verification.json').write_text(json.dumps({
              'url': os.environ['PUBLIC_URL'], 'http_status': 200,
              'commit': os.environ['GITHUB_SHA'], 'content_matches_source': True
          }, indent=2))
          PY
              exit 0
            fi
            sleep 10
          done
          echo 'Pages has not served this commit at the exact 404 preview URL within 10 minutes.' >&2
          exit 1
      - name: Verify public pages and theme download
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://annie-lis.github.io/moscow-city-print-preview/downloads/moscow-city-print-child-0.5.0.zip \
            --output public-theme.zip
          cmp downloads/moscow-city-print-child-0.5.0.zip public-theme.zip
          for route in index about sitemap privacy-policy requisites products payment-delivery artwork-requirements blog article-short article-long; do
            curl --fail --silent --show-error --location --max-time 30 \
              "https://annie-lis.github.io/moscow-city-print-preview/$route.html" \
              --output "public-$route.html"
            cmp "$route.html" "public-$route.html"
          done
          code=$(curl --silent --show-error --location --max-time 30 --output /dev/null \
            --write-out '%{http_code}' https://annie-lis.github.io/moscow-city-print-preview/contacts.html)
          test "$code" = 404
          code=$(curl --silent --show-error --location --max-time 30 --output public-nested-404.html \
            --write-out '%{http_code}' https://annie-lis.github.io/moscow-city-print-preview/mcp-no-such-page/nested/)
          test "$code" = 404
          cmp 404.html public-nested-404.html
          for file in site-assets/assets/css/not-found.css site-assets/assets/images/illustrations/mcp-404-illustration-final.webp site-assets/assets/images/illustrations/library/01-printing-press-stack.webp site-assets/assets/images/illustrations/library/05-graphite-print-sheet-control.webp comparisons/about-three-1440.png comparisons/about-thirds-1440.png comparisons/about-thirds-768.png comparisons/about-thirds-390.png comparisons/about-thirds-01-03-1440.png comparisons/about-optical-center-1440.png comparisons/about-final-check-1440.png comparisons/about-final-check-768.png comparisons/about-final-check-390.png comparisons/about-two-images-1440.png site-assets/assets/css/blog.css site-assets/assets/css/article.css preview-assets/blog.js; do
            curl --fail --silent --show-error --location --max-time 30 \
              "https://annie-lis.github.io/moscow-city-print-preview/$file" --output public-404-resource
            cmp "$file" public-404-resource
          done
          echo 'Verified custom 404 HTML and HTTP 404 at a nested missing URL'
      - name: Verify five service drafts and their exact published assets
        run: |
          for route in privacy-policy requisites payment-delivery sitemap artwork-requirements; do
            grep -q 'mcp-service-illustration' "$route.html"
            grep -q "mcp-$route-illustration.webp" "$route.html"
            for extension in png webp; do
              file="site-assets/assets/images/illustrations/mcp-$route-illustration.$extension"
              curl --fail --silent --show-error --location --max-time 30 \
                "https://annie-lis.github.io/moscow-city-print-preview/$file" --output public-service-resource
              cmp "$file" public-service-resource
            done
          done
          curl --fail --silent --show-error --location --max-time 30 \
            https://annie-lis.github.io/moscow-city-print-preview/site-assets/assets/css/service-pages.css \
            --output public-service-pages.css
          cmp site-assets/assets/css/service-pages.css public-service-pages.css
      - name: Save publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification
          path: |
            pages-config.json
            pages-verification.json
          if-no-files-found: ignore
