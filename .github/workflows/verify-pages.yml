name: Verify published preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: verify-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment scaffold is in the publication source
        run: |
          test -f about.html
          test -f site-assets/assets/css/internal.css
          test -f site-assets/assets/css/requisites.css
          test -f site-assets/assets/css/payment-delivery.css
          (cd downloads && sha256sum --check moscow-city-print-child-0.4.9.zip.sha256)
          python3 - <<'PY'
          from pathlib import Path
          text = Path('about.html').read_text().replace('\u00a0', ' ')
          assert '<h1 class="mcp-page-title">О типографии</h1>' in text
          assert 'брендбука' not in text
          requisites = Path('requisites.html').read_text()
          assert 'class="mcp-requisites-details"' in requisites
          assert 'class="mcp-page-title"' not in requisites
          assert 'Подготовка документов обычно занимает от 1 до 5 рабочих дней.' in requisites
          for value in ('Лис Анна Владимировна','772425521744','320774600200503','mailto:office@moscowcityprint.ru'):
              assert value in requisites, value
          payment = Path('payment-delivery.html').read_text()
          assert 'class="mcp-delivery-options"' in payment
          assert '100% предоплате' in payment
          for route in ('index','about','services','products','blog','privacy-policy','payment-delivery','artwork-requirements','requisites','sitemap','vacancies','404'):
              assert Path(route + '.html').is_file(), route
          assert not Path('contacts.html').exists()
          sitemap = Path('sitemap.html').read_text()
          assert sitemap.count('<li><a ') == 10
          assert 'href="#contacts">Контакты</a>' in sitemap
          for page in Path('.').glob('*.html'):
              html = page.read_text()
              assert 'href="contacts.html"' not in html and 'href="/contacts/"' not in html, page
              assert 'id="contacts"' in html and 'href="#contacts"' in html, page
          PY
      - name: Read GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" \
            --jq '{html_url,build_type,status,source}' | tee pages-config.json
      - name: Verify the exact public Payment and Delivery URL after deployment
        env:
          PUBLIC_URL: https://annie-lis.github.io/moscow-city-print-preview/payment-delivery.html
          PUBLIC_CSS_URL: https://annie-lis.github.io/moscow-city-print-preview/site-assets/assets/css/payment-delivery.css
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' --output live-payment-delivery.html \
              --write-out '%{http_code}' "$PUBLIC_URL" || true)
            echo "Attempt $attempt: $PUBLIC_URL HTTP $code"
            curl --fail --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' --output live-payment-delivery.css "$PUBLIC_CSS_URL" || true
            if [ "$code" = 200 ] && cmp --silent payment-delivery.html live-payment-delivery.html && \
              cmp --silent site-assets/assets/css/payment-delivery.css live-payment-delivery.css; then
              echo "Verified HTTP 200 and exact content match for commit $GITHUB_SHA"
              sha256sum payment-delivery.html live-payment-delivery.html
              echo "Verified public payment/delivery stylesheet matches source"
              python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('pages-verification.json').write_text(json.dumps({
              'url': os.environ['PUBLIC_URL'], 'http_status': 200,
              'commit': os.environ['GITHUB_SHA'], 'content_matches_source': True
          }, indent=2))
          PY
              exit 0
            fi
            sleep 10
          done
          echo 'Pages has not served this commit at the exact Payment and Delivery URL within 10 minutes.' >&2
          exit 1
      - name: Verify public pages and theme download
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://annie-lis.github.io/moscow-city-print-preview/downloads/moscow-city-print-child-0.4.9.zip \
            --output public-theme.zip
          cmp downloads/moscow-city-print-child-0.4.9.zip public-theme.zip
          for route in index sitemap products payment-delivery artwork-requirements; do
            curl --fail --silent --show-error --location --max-time 30 \
              "https://annie-lis.github.io/moscow-city-print-preview/$route.html" \
              --output "public-$route.html"
            cmp "$route.html" "public-$route.html"
          done
          code=$(curl --silent --show-error --location --max-time 30 --output /dev/null \
            --write-out '%{http_code}' https://annie-lis.github.io/moscow-city-print-preview/contacts.html)
          test "$code" = 404
      - name: Save publication verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-verification
          path: |
            pages-config.json
            pages-verification.json
          if-no-files-found: ignore
